name: Build XAI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create XAI Project
        run: cordova create xai-apk com.xai.builder XAI

      - name: Copy App Files
        run: |
          if [ -d "www" ]; then
            rm -rf xai-apk/www
            cp -r www xai-apk/www
          fi

      - name: Add Android Platform
        working-directory: xai-apk
        run: cordova platform add android@15.1.0

      - name: Build XAI APK
        working-directory: xai-apk
        run: cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAI-APK
          path: xai-apk/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
